{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Mon Blog{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
   <header>
    <a href="{% url 'blog:article_list' %}">📝 Mon Blog</a>

    <nav class="user-nav">
        {% if user.is_authenticated %}
            <span>👤 {{ user.username }}</span>
            <form method="post" action="{% url 'logout' %}" style="display:inline;">
                {% csrf_token %}
                <button type="submit" class="link-btn">Déconnexion</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}">Connexion</a>
        {% endif %}
    </nav>
</header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        &copy; 2026 — Mon Blog Django
    </footer>
</body>
</html>
