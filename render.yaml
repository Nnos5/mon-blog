services:
  - type: web
    name: camblog
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn monblog.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "mon-blog-6mxn.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: camblog-db
          property: connectionString

databases:
  - name: camblog-db
    databaseName: camblog
    user: camblog